<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Castlelands — Medieval Tile-Laying Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="logo">🏰 <b>CASTLELANDS</b></div>
    <div id="turnLabel"></div>
    <div id="deckCount"></div>
  </div>
  <div id="main">
    <div id="canvasWrap"><canvas id="board"></canvas></div>
    <div id="side">
      <div class="panel">
        <div class="panel-title">Your tile</div>
        <canvas id="preview" width="120" height="120"></canvas>
        <button id="btnRotate">↻ Rotate <small>(R)</small></button>
        <button id="btnSkipMeeple" hidden>Skip follower</button>
      </div>
      <div class="panel" id="playersPanel">
        <div class="panel-title">Players</div>
        <div id="players"></div>
      </div>
      <div class="panel grow">
        <div class="panel-title">Log</div>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="menuModal" class="modal">
  <div class="modal-box">
    <h1>🏰 Castlelands</h1>
    <p class="tagline">Build the medieval countryside, tile by tile.</p>
    <div class="menurow">
      <label>Human players
        <select id="selHumans">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label>Computer players
        <select id="selAis">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
    </div>
    <button id="btnStart" class="primary">▶ Start game</button>
    <p class="hint">Drag to pan · wheel to zoom · R to rotate · place a tile, then optionally
    a follower on a city, road or monastery to score points.</p>
  </div>
</div>

<div id="overModal" class="modal" hidden>
  <div class="modal-box">
    <h2 id="overTitle"></h2>
    <div id="overBody"></div>
    <button id="btnAgain" class="primary">Play again</button>
  </div>
</div>

<script src="js/sdk.js"></script>
<script src="js/tiles.js"></script>
<script src="js/logic.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
